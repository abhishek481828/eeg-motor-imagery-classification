[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-mi"
version = "0.1.0"
description = "Enhanced EEG Motor Imagery Classification Using GAN-Based Data Augmentation and CNN-LSTM Deep Learning"
readme = "README.md"
authors = [
    { name = "Research Software Architecture Team" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "mne>=1.5.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pywavelets>=1.4.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "mlflow>=2.5.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
    "jupyter>=1.0.0",
]

[project.scripts]
eeg-mi = "eeg_mi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long
    "B904", # raise from
    "B905", # zip strict
    "E402", # module level import not at top of file
]

[tool.ruff.lint.isort]
known-first-party = ["eeg_mi"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=src/eeg_mi --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["no-any-return"]

[tool.coverage.run]
source = ["src/eeg_mi"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
