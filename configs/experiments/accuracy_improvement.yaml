# Accuracy Improvement Study Experiment Configuration

experiment_name: "accuracy_improvement_study"
random_seed: 42

# Phase B: Filter-Bank Sub-Bands
filter_bank:
  sfreq: 160.0
  bands:
    theta: [4.0, 8.0]
    mu: [8.0, 12.0]
    low_beta: [12.0, 18.0]
    high_beta: [18.0, 26.0]
    gamma: [26.0, 40.0]

# Phase C: Spatial Feature Parameters
spatial:
  csp_components: [4, 8, 12, 16]
  riemannian_estimator: "cov"

# Phase D: Temporal Models to Evaluate
temporal_models:
  multiscale_cnn:
    kernel_sizes: [7, 15, 31, 63]
    branch_channels: [16, 32, 64]
    dropout: 0.25
    lr: 0.001
  temporal_attention:
    filters: [32, 64, 128]
    kernel_size: 15
    dropout: 0.25
    lr: 0.001
  riemannian_fusion:
    cnn_filters: [32, 64, 128]
    dropout: 0.25
    lr: 0.0005

# Phase E: Ensemble Search Grid
ensemble:
  weight_step: 0.05
  min_weight: 0.0
  max_weight: 1.0
