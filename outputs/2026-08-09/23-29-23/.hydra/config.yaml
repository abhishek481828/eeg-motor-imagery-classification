data:
  dataset_name: physionet_eegmmidb_2class
  raw_data_dir: ./data/raw/physionet
  processed_data_dir: ./data/processed
  sampling_rate: 160
  num_channels: 64
  l_freq: 7.0
  h_freq: 30.0
  notch_freq: 60.0
  window_duration: 3.0
  window_overlap: 0.0
  classes:
  - left_fist
  - right_fist
  num_classes: 2
  relevant_runs:
  - 4
  - 8
  - 12
experiments:
  model_type: cnn_lstm
  use_gan_augmentation: false
  architecture:
    cnn_filters:
    - 32
    - 64
    - 128
    kernel_size: 15
    pool_size: 2
    lstm_hidden_size: 128
    lstm_layers: 2
    dropout: 0.5
  training:
    batch_size: 32
    epochs: 100
    learning_rate: 0.001
    weight_decay: 0.0001
    scheduler: reduce_on_plateau
    patience: 10
    early_stopping_patience: 15
splits:
  split_type: subject_independent
  seed: 42
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  total_subjects: 109
  exclude_subjects:
  - 88
  - 92
  - 100
  manifest_path: ./data/splits/subject_split.json
seed: 42
device: auto
batch_size: 8
num_workers: 0
pin_memory: false
mixed_precision: false
use_gan_augmentation: false
experiment_name: eeg_motor_imagery_default
output_dir: ./reports/experiments
checkpoint_dir: ./models/checkpoints
mlflow:
  tracking_uri: sqlite:///mlruns.db
  experiment_name: eeg_motor_imagery_research
